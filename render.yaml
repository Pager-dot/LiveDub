# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Render asks for the two API keys when the Blueprint is created (sync: false keeps them out of git).
services:
  - type: web
    name: livedub
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
